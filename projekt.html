<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Namens Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        .container {
            display: flex;
            gap: 10px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 220px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #2d89ef;
            color: white;
            margin-left: 5px;
        }

        button:hover {
            background: #1b5fbf;
        }

        ul {
            margin-top: 20px;
            padding: 0;
            width: 300px;
        }

        li {
            list-style: none;
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        li button {
            padding: 5px 8px;
            font-size: 12px;
        }

        body button:last-child {
            margin-top: 15px;
            background: #444;
        }

        body button:last-child:hover {
            background: #222;
        }
    </style>
</head>

<body>

    <div class="container">
        <input id="inputName" placeholder="Name eingeben">
        <button id="addBtn">Hinzufügen</button>
    </div>

    <ul id="liste"></ul>

    <button onclick="clearAll()">Alle löschen</button>

    <script>

        let namen = [];

        function formatName(name) {
            name = name.trim();

            let erster = name.charAt(0).toUpperCase();
            let rest = name.slice(1).toLowerCase();

            return erster + rest;
        }

        function addName() {
            const input = document.querySelector("#inputName");
            let name = input.value;

            name = name.trim();

            if (name == "") return;

            namen[namen.length] = formatName(name);

            input.value = "";
            anzeigen();
        }

        function deleteName(index) {
            namen.splice(index, 1);
            anzeigen();
        }

        function replaceName(index) {
            let name = prompt("Neuen Namen eingeben:");

            if (name == null) return;

            name = name.trim();

            if (name == "") return;

            namen[index] = formatName(name);
            anzeigen();
        }

        function clearAll() {
            namen = [];
            anzeigen();
        }

        function anzeigen() {
            const liste = document.getElementById("liste");
            liste.innerHTML = "";

            for (let i = 0; i < namen.length; i = i + 1) {

                const li = document.createElement("li");
                li.textContent = namen[i];

                const replaceBtn = document.createElement("button");
                replaceBtn.textContent = "Edit";
                replaceBtn.onclick = function () {
                    replaceName(i);
                };

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "X";
                deleteBtn.onclick = function () {
                    deleteName(i);
                };

                li.appendChild(replaceBtn);
                li.appendChild(deleteBtn);

                liste.appendChild(li);
            }
        }

        document.getElementById("addBtn").addEventListener("click", addName);

        document.getElementById("inputName").addEventListener("keypress", function (e) {
            if (e.key == "Enter") {
                addName();
            }
        });

    </script>

</body>

</html>
